<h1>Forms</h1>
<form #formuser="ngForm" (ngSubmit)="recibirDatos()">
    <label for="nombre">Nombre</label><br>
    <input type="text" name="nombre" id="nombre" [(ngModel)]="user.nombre" #inputNombre><br><br>

    <label for="apellido">Apellidos</label><br>
    <input type="text" name="apellidos" id="apellidos" [(ngModel)]="user.apellidos" #inputApellidos><br><br>

    <label for="edad">Edad</label><br>
    <input type="number" name="edad" id="edad" [(ngModel)]="user.edad" #inputEdad><br><br>
    <button type="submit" >Enviar</button>
</form>

<h2 style="color: aquamarine;">
    Nombre: {{user.nombre}}, Apellidos: {{user.apellidos}},
    Edad: {{user.edad}}
</h2>

<form #formuserNoBinding="ngForm" (ngSubmit)="recibirDatos()">
    <label for="nombre">Nombre</label><br>
    <input type="text" name="nombre" id="nombre" #inputNombre2><br><br>

    <label for="apellido">Apellidos</label><br>
    <input type="text" name="apellidos" id="apellidos" #inputApellidos2><br><br>

    <label for="edad">Edad</label><br>
    <input type="number" name="edad" id="edad" #inputEdad2><br><br>
    <button type="submit" >Enviar</button>
</form>
