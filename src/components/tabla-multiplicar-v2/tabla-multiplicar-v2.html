<form #ngform="ngForm" (ngSubmit)="multiplicarNumero()">
    <label for="num">Número</label>
    <input type="number" name="num" id="num" #num required>
    <button type="submit">Multiplicar</button>
</form>

<h1>{{numero.nativeElement.value * 1}}</h1>

<ul>
    @for (num of numeros; track $index) {
        <li>{{num}}</li>
    }
</ul>

<ul>
    @for (num of numeros; track $index; let i = $index) {
        <li>{{numero.nativeElement.value * 1}} * {{i + 1}} = {{num}}</li>
    }
</ul>
